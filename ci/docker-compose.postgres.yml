# Local PostgreSQL for the live integration suites.
#   docker compose -f ci/docker-compose.postgres.yml up -d
#   ci/run_postgres_live.sh   # applies migrations + provisioning, runs live tests
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: interlock_owner
      POSTGRES_PASSWORD: owner_pw
      POSTGRES_DB: interlock
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interlock_owner -d interlock"]
      interval: 2s
      timeout: 3s
      retries: 30
