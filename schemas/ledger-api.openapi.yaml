openapi: 3.1.0
info:
  title: Agent Interlock Ledger API
  version: 0.2.0
  description: Tenant-bound event ingestion, OTLP/HTTP runtime decoding, bounded trace queries, and security statistics.
servers:
  - url: http://127.0.0.1:8080
    description: Loopback reference server; production requires TLS at a trusted proxy.
security:
  - bearerAuth: []
paths:
  /v1/events:
    post:
      operationId: ingestEvent
      summary: Append one normalized event
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/IdempotencyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Event appended or an exact idempotent replay returned
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    $ref: '#/components/schemas/Event'
                additionalProperties: false
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Idempotency key is bound to a different normalized event
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/traces:
    post:
      operationId: importOTLPTraces
      summary: Decode one authenticated OTLP/HTTP JSON export for runtime reconciliation
      description: Requires the telemetry:write scope. The reference endpoint returns observations and issues but does not append Ledger events.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTLPTraceExport'
      responses:
        '200':
          description: OTLP spans decoded into security relationship observations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelemetryImportResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/traces/{trace_id}:
    get:
      operationId: getTrace
      summary: Query one tenant-scoped trace in canonical event order
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: trace_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: cursor
          in: query
          schema: {type: string, minLength: 1, maxLength: 512}
      responses:
        '200':
          description: Trace page; an unknown or cross-tenant trace is an empty page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TracePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/interactions:
    get:
      operationId: searchInteractions
      summary: Find interactions and their trace IDs from complete lifecycle evidence
      description: >-
        Requires events:read. Selects interactions started in [start,end), including
        later lifecycle evidence. Exact filters apply after reduction. The cursor
        is bound to the tenant, time window and filters. Exceeding the configured
        event scan cap returns 422; no incomplete page is presented as complete.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - {name: start, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: end, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
        - {name: sourceActorId, in: query, schema: {type: string, minLength: 1}}
        - {name: targetActorId, in: query, schema: {type: string, minLength: 1}}
        - {name: traceId, in: query, schema: {type: string, minLength: 1}}
        - {name: reasonCode, in: query, schema: {type: string, minLength: 1}}
        - {name: outcome, in: query, schema: {type: string, minLength: 1}}
        - {name: relationshipId, in: query, schema: {type: string, minLength: 1}}
        - {name: policyId, in: query, schema: {type: string, minLength: 1}}
        - {name: mode, in: query, schema: {type: string, minLength: 1}}
        - {name: dataSource, in: query, schema: {type: string, minLength: 1}}
      responses:
        '200':
          description: Interaction page with trace links, coverage, and observation window
          content:
            application/json:
              schema:
                type: object
                required: [interactions, nextCursor, window, observation]
                properties:
                  interactions:
                    type: array
                    items: {$ref: '#/components/schemas/InteractionRecord'}
                  nextCursor: {type: [string, 'null']}
                  window:
                    type: object
                    properties:
                      start: {type: string, format: date-time}
                      end: {type: string, format: date-time}
                  observation:
                    type: object
                    properties:
                      source: {const: LEDGER}
                      eventCount: {type: integer, minimum: 0}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: Too much evidence; narrow the time range
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/statistics:
    get:
      operationId: getStatistics
      summary: Aggregate tenant-scoped security statistics over a time range
      description: >-
        Selects tenant interactions whose INTERACTION_REQUESTED occurred in
        [from, to), loads each selected interaction's complete lifecycle, and
        reduces those events into the
        SecurityStatistics contract (schemas/security-statistics.schema.json)
        by joining each interaction_id across its lifecycle. Requires the
        statistics:read scope, which grants aggregates only - not raw events.
        Responds 422 when the range matches more events than the server's
        configured maximum; narrow the range and retry.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
          description: Inclusive ISO 8601 lower bound on INTERACTION_REQUESTED.occurred_at.
        - name: to
          in: query
          required: true
          schema: {type: string, format: date-time}
          description: Exclusive ISO 8601 upper bound on INTERACTION_REQUESTED.occurred_at.
        - name: dataSource
          in: query
          schema: {type: string, enum: [PRODUCTION, SIMULATION, RED_TEAM, TEST]}
          description: Restrict to one data source; omitted means all, partitioned.
      responses:
        '200':
          description: Statistics for the range
          content:
            application/json:
              schema:
                type: object
                required: [from, to, statistics]
                properties:
                  from: {type: string, format: date-time}
                  to: {type: string, format: date-time}
                  statistics:
                    $ref: './security-statistics.schema.json'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: The range matches more events than the server allows in one aggregation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A token verified by the configured authenticator and bound to tenant, scopes, and allowed source Actor IDs; do not decode an unverified JWT.
  parameters:
    TenantHeader:
      name: X-Interlock-Tenant-Id
      in: header
      required: true
      schema: {type: string, minLength: 1}
      description: Must exactly match the authenticated principal tenant.
    IdempotencyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 200}
  schemas:
    InteractionRecord:
      type: object
      required: [interactionId, tenantId, traceId, sourceActorId, securityOutcome, coverage, firstOccurredAt]
      properties:
        interactionId: {type: string}
        tenantId: {type: string}
        sourceActorId: {type: string}
        environment: {type: string}
        dataSource: {type: string}
        relationshipId: {type: string}
        decision: {type: string}
        securityOutcome: {type: string}
        firstOccurredAt: {type: string}
        traceId: {type: [string, 'null']}
        targetActorId: {type: [string, 'null']}
        policyId: {type: [string, 'null']}
        mode: {type: [string, 'null']}
        bundleDigest: {type: [string, 'null']}
        actualEnforced: {type: boolean}
        executionPermitted: {type: boolean}
        controlEvaluated: {type: boolean}
        executionAttempted: {type: boolean}
        executionSucceeded: {type: boolean}
        enforcementActionCompleted: {type: boolean}
        reasonCodes: {type: array, items: {type: string}}
        coverage:
          type: object
          required: [armed, ran, flagged]
          properties:
            armed: {type: array, items: {type: string}}
            ran: {type: array, items: {type: string}}
            flagged: {type: array, items: {type: string}}
    EventInput:
      type: object
      required: [event_type, tenant_id, trace_id, span_id, source_actor_id, payload]
      properties:
        event_type:
          $ref: '#/components/schemas/EventType'
        tenant_id: {type: string, minLength: 1}
        trace_id: {type: string, minLength: 1, maxLength: 256}
        span_id: {type: string, minLength: 1, maxLength: 256}
        parent_span_id: {type: [string, 'null'], maxLength: 256}
        interaction_id: {type: [string, 'null'], maxLength: 256}
        source_actor_id: {type: string, minLength: 1, maxLength: 512}
        target_actor_id: {type: [string, 'null'], maxLength: 512}
        relationship_type: {type: string, minLength: 1, maxLength: 64, default: INVOKES}
        relationship_id: {type: string, pattern: '^REL-[0-9]{2}$', default: REL-05}
        severity: {$ref: '#/components/schemas/Severity'}
        environment: {type: string, enum: [DEV, STAGE, PROD], default: DEV}
        data_source:
          type: string
          enum: [PRODUCTION, SIMULATION, RED_TEAM, TEST]
          default: PRODUCTION
        payload:
          type: object
          description: The _interlock key is reserved; the API adds authenticated producer metadata.
      additionalProperties: false
    Event:
      type: object
      required:
        - event_id
        - event_type
        - schema_version
        - occurred_at
        - ingested_at
        - tenant_id
        - environment
        - data_source
        - trace_id
        - span_id
        - parent_span_id
        - interaction_id
        - source_actor_id
        - target_actor_id
        - relationship_type
        - relationship_id
        - severity
        - payload
        - integrity_hash
      properties:
        event_id: {type: string, format: uuid}
        event_type: {$ref: '#/components/schemas/EventType'}
        schema_version: {type: string, const: '1.0'}
        occurred_at: {type: string, format: date-time}
        ingested_at: {type: string, format: date-time}
        tenant_id: {type: string, minLength: 1}
        environment: {type: string, enum: [DEV, STAGE, PROD]}
        data_source: {type: string, enum: [PRODUCTION, SIMULATION, RED_TEAM, TEST]}
        trace_id: {type: string, minLength: 1, maxLength: 256}
        span_id: {type: string, minLength: 1, maxLength: 256}
        parent_span_id: {type: [string, 'null'], maxLength: 256}
        interaction_id: {type: [string, 'null'], maxLength: 256}
        source_actor_id: {type: string, minLength: 1, maxLength: 512}
        target_actor_id: {type: [string, 'null'], maxLength: 512}
        relationship_type: {type: string, minLength: 1, maxLength: 64}
        relationship_id: {type: string, pattern: '^REL-[0-9]{2}$'}
        severity: {$ref: '#/components/schemas/Severity'}
        payload: {type: object}
        integrity_hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      additionalProperties: false
    TracePage:
      type: object
      required: [trace_id, events, next_cursor]
      properties:
        trace_id: {type: string}
        events:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/Event'}
        next_cursor: {type: [string, 'null']}
      additionalProperties: false
    OTLPTraceExport:
      type: object
      required: [resourceSpans]
      properties:
        resourceSpans:
          type: array
          items: {type: object}
      additionalProperties: true
    TelemetryObservation:
      type: object
      required: [source_actor_id, target_actor_id, relationship_type, relationship_id, interaction_id]
      properties:
        source_actor_id: {type: string}
        target_actor_id: {type: string}
        relationship_type: {type: string}
        relationship_id: {type: string}
        interaction_id: {type: [string, 'null']}
      additionalProperties: false
    TelemetryImportIssue:
      type: object
      required: [code, message, span_id]
      properties:
        code: {type: string}
        message: {type: string}
        span_id: {type: [string, 'null']}
      additionalProperties: false
    TelemetryImportResult:
      type: object
      required: [format, observations, control_evaluated_interactions, issues]
      properties:
        format: {type: string, const: OTLP_JSON}
        observations:
          type: array
          items: {$ref: '#/components/schemas/TelemetryObservation'}
        control_evaluated_interactions:
          type: array
          items: {type: string}
        issues:
          type: array
          items: {$ref: '#/components/schemas/TelemetryImportIssue'}
      additionalProperties: false
    EventType:
      type: string
      enum:
        - INTERACTION_REQUESTED
        - DATA_FLOW_OBSERVED
        - CONTROL_EVALUATED
        - CONTROL_COVERAGE_DECLARED
        - ACTION_EXECUTED
        - INTERACTION_COMPLETED
        - SECURITY_OUTCOME_SET
        - DETECTION_RAISED
        - INCIDENT_UPDATED
        - CONTROL_HEALTH_CHANGED
        - POLICY_CHANGED
        - TEST_EXECUTED
        - WORKFLOW_RUN_CREATED
        - WORKFLOW_RUN_STARTED
        - WORKFLOW_RUN_WAITING_APPROVAL
        - WORKFLOW_RUN_COMPLETED
        - WORKFLOW_RUN_FAILED
        - WORKFLOW_RUN_CANCELED
        - WORKFLOW_TASK_STATUS_UPDATED
        - WORKFLOW_TASK_APPROVED
        - PROVIDER_CALL_RECORDED
    Severity:
      type: string
      enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]
      default: INFO
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
          additionalProperties: false
      additionalProperties: false
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or invalid bearer authentication
      headers:
        WWW-Authenticate: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Principal tenant, scope, or origin denied
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooLarge:
      description: Request body exceeds the configured bound
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Ledger unavailable; storage details are not disclosed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
